<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biblioteca Virtual 3D</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="ui-container">
        <header>
            <div class="header-title-row">
                <h1 id="shelf-title-display">Biblioteca Virtual 3D</h1>
                <button id="btn-rename-shelf" class="btn-icon hidden" title="Renombrar esta estantería">✏️</button>
            </div>
            <p id="shelf-subtitle">Haz clic en una estantería para acercarte</p>
        </header>

        <div id="controls">
            <button id="btn-reset-cam" class="btn hidden">← Volver a Vista General</button>
            <button id="btn-add-book" class="btn">+ Agregar Libro</button>
        </div>
    </div>

    <!-- Inspector de Libro -->
    <div id="book-info-card" class="card-info hidden">
        <h2 id="card-title">Título del Libro</h2>
        <p id="card-author">Autor</p>
        <div class="card-actions">
            <button id="btn-flip-book" class="btn btn-secondary">🔄 Rotar Portada/Lomo</button>
            <button id="btn-delete-book" class="btn btn-danger">Eliminar Libro</button>
            <button id="btn-close-inspect" class="btn btn-secondary">Regresar a Repisa</button>
        </div>
    </div>

    <!-- Modal Agregar Libro -->
    <div id="modal-add-book" class="modal hidden">
        <div class="modal-content">
            <h2>Agregar Nuevo Libro</h2>
            <form id="form-book">
                <label>Título:
                    <input type="text" id="input-title" required placeholder="Ej. Cien Años de Soledad">
                </label>
                <label>Autor:
                    <input type="text" id="input-author" required placeholder="Ej. Gabriel García Márquez">
                </label>
                <label>Estantería:
                    <select id="select-shelf"></select>
                </label>
                <label>Repisa (Nivel):
                    <select id="select-level">
                        <option value="0">Repisa 1 (Superior)</option>
                        <option value="1">Repisa 2</option>
                        <option value="2">Repisa 3</option>
                        <option value="3">Repisa 4</option>
                        <option value="4">Repisa 5 (Inferior)</option>
                    </select>
                </label>
                <label>Foto del Lomo (Ajusta el grosor automáticamente):
                    <input type="file" id="input-spine-file" accept="image/*" required>
                </label>
                <label>Foto de la Portada:
                    <input type="file" id="input-cover-file" accept="image/*" required>
                </label>
                <div class="modal-buttons">
                    <button type="submit" class="btn">Guardar Libro</button>
                    <button type="button" id="btn-cancel" class="btn btn-secondary">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
