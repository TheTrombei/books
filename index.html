<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biblioteca Virtual 3D</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Three.js y GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div id="ui-container">
        <header>
            <h1 id="shelf-title-display">Biblioteca Virtual 3D</h1>
            <p id="shelf-subtitle">Haz clic en una estantería para acercarte</p>
        </header>

        <div id="controls">
            <button id="btn-reset-cam" class="btn hidden">← Volver a Vista General</button>
            <button id="btn-add-book" class="btn">+ Agregar Libro</button>
        </div>
    </div>

    <!-- Modal Libro Seleccionado -->
    <div id="book-info-card" class="card-info hidden">
        <h3 id="card-title">Título del Libro</h3>
        <p id="card-author">Autor</p>
        <button id="btn-delete-book" class="btn btn-danger">Eliminar Libro</button>
    </div>

    <!-- Modal para Agregar Libro -->
    <div id="modal-add-book" class="modal hidden">
        <div class="modal-content">
            <h2>Agregar Nuevo Libro</h2>
            <form id="form-book">
                <label>Título:
                    <input type="text" id="input-title" required placeholder="Ej. Cien Años de Soledad">
                </label>
                <label>Autor:
                    <input type="text" id="input-author" required placeholder="Ej. Gabriel García Márquez">
                </label>
                <label>Estantería:
                    <select id="select-shelf">
                        <option value="0">Estantería Izquierda</option>
                        <option value="1">Estantería Central</option>
                        <option value="2">Estantería Derecha</option>
                    </select>
                </label>
                <label>Repisa (Estante):
                    <select id="select-level">
                        <option value="0">Repisa 1 (Superior)</option>
                        <option value="1">Repisa 2</option>
                        <option value="2">Repisa 3</option>
                        <option value="3">Repisa 4 (Inferior)</option>
                    </select>
                </label>
                <label>Foto de la Portada (Desde tu PC):
                    <input type="file" id="input-cover-file" accept="image/*" required>
                </label>
                <label>Foto del Lomo (Desde tu PC - Opcional):
                    <input type="file" id="input-spine-file" accept="image/*">
                </label>
                <div class="modal-buttons">
                    <button type="submit" class="btn">Guardar en Librería</button>
                    <button type="button" id="btn-cancel" class="btn btn-secondary">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
